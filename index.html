<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233a2414'/%3E%3Ctext x='8' y='46' font-family='Georgia,serif' font-weight='900' font-size='38' fill='%23fffdf8'%3EB%3C/text%3E%3Ctext x='36' y='40' font-family='Georgia,serif' font-weight='900' font-size='30' fill='%23f2b705'%3E+%3C/text%3E%3C/svg%3E">
  <title>Barque+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="checking">
  <div class="app">

    <!-- ============ LEFT SIDEBAR: sections menu ============ -->
    <aside class="sidebar sidebar-left" id="leftSidebar">
      <div class="sidebar-top">
        <a href="#news" class="brand" title="Barque+">
          <span class="brand-full fade-label">Barque<span class="plus">+</span></span>
        </a>
        <button class="collapse-btn" id="leftToggle" aria-label="Collapse menu" aria-expanded="true">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>

      <nav class="nav" id="nav">
        <!-- Section links are added by js/app.js from the SECTIONS list -->
      </nav>

      <div class="sidebar-foot fade-label">Bellevue High School</div>
    </aside>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="main">
      <header class="masthead">
        <div class="masthead-date" id="todayDate"></div>
        <h1 class="masthead-title">Barque<span class="plus">+</span></h1>
        <div class="masthead-sub">The Barque, but more.</div>
      </header>

      <div class="editor-banner">Editor Mode is on: editing tools are showing.</div>

      <section class="page" id="page">
        <!-- The current section's content is drawn here by js/app.js -->
      </section>
    </main>

    <!-- ============ RIGHT SIDEBAR: profile ============ -->
    <aside class="sidebar sidebar-right" id="rightSidebar">
      <div class="sidebar-top">
        <button class="collapse-btn" id="rightToggle" aria-label="Collapse profile" aria-expanded="true">
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <!-- ===== Shown when logged in ===== -->
      <div class="profile only-logged-in">
        <button class="avatar" id="avatarBtn" title="Click to change icon" aria-label="Change profile icon">
          <!-- Icon drawn by js/app.js -->
        </button>
        <div class="profile-name fade-label" id="profileName"></div>
        <div class="profile-type fade-label" id="profileType">Profile Type</div>
      </div>

      <!-- Later steps add things here (editor mode switch, etc.) -->
      <div class="sidebar-slot fade-label only-logged-in" id="rightSlot"></div>

      <div class="sidebar-bottom fade-label only-logged-in">
        <button class="btn-outline" id="logoutBtn">Log Out</button>
      </div>

      <!-- ===== Shown when logged out ===== -->
      <div class="auth only-logged-out">
        <div class="auth-brand">Barque<span class="plus">+</span></div>
        <p class="auth-welcome" id="authWelcome">Log in with your school account to continue.</p>

        <!-- Shown if Firebase can't be reached -->
        <p class="form-error" id="startupError" role="alert"></p>

        <!-- Log In / Create Account -->
        <div id="authChooser">
          <div class="auth-tabs">
            <button class="auth-tab" data-mode="login">Log In</button>
            <button class="auth-tab" data-mode="register">Create Account</button>
          </div>

          <form class="auth-form" id="authForm" novalidate hidden>
            <h3 class="auth-heading" id="authHeading"></h3>

            <label class="field">
              <span>Email</span>
              <input type="email" id="authEmail" placeholder="you@bsd405.org" autocomplete="username">
            </label>
            <div class="username-preview" id="usernamePreview"></div>

            <label class="field" id="passwordField">
              <span id="passwordLabel">Password</span>
              <input type="password" id="authPassword" autocomplete="current-password">
            </label>

            <label class="field" id="confirmField">
              <span>Type password again</span>
              <input type="password" id="authConfirm" autocomplete="new-password">
            </label>

            <p class="form-error" id="authError" role="alert"></p>
            <p class="form-success" id="authSuccess" role="status"></p>

            <button type="submit" class="btn-primary" id="authSubmit">Log In</button>

            <div class="auth-links">
              <button type="button" class="link-btn" id="forgotBtn">Forgot password?</button>
            </div>
          </form>
        </div>

        <!-- Waiting for the person to click the link in their email -->
        <div class="verify" id="verifyPanel" hidden>
          <h3 class="auth-heading">Check your email</h3>
          <p class="code-note" id="verifyNote"></p>
          <p class="form-error" id="verifyError" role="alert"></p>
          <p class="form-success" id="verifySuccess" role="status"></p>
          <button class="btn-primary" id="verifyDoneBtn">I've clicked the link</button>
          <div class="auth-links">
            <button type="button" class="link-btn" id="verifyResendBtn">Resend link</button>
            <button type="button" class="link-btn" id="verifyLogoutBtn">Use a different account</button>
          </div>
        </div>
      </div>
    </aside>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
